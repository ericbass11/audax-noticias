services:
  postgres:
    image: postgres:16-alpine
    container_name: audax-postgres
    environment:
      POSTGRES_USER: audax
      POSTGRES_PASSWORD: audax
      POSTGRES_DB: audax_noticias
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audax -d audax_noticias"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: audax-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audax-backend
    env_file:
      - .env
    environment:
      # Sobrescreve hosts para a rede do compose (ignora o que vier do .env).
      DATABASE_URL: postgresql://audax:audax@postgres:5432/audax_noticias
      REDIS_URL: redis://redis:6379
      # Aponta para o LiteLLM do gateway externo (stack audax-ai-gateway),
      # alcançável pelo nome do serviço na rede compartilhada abaixo.
      # LITELLM_API_KEY vem do .env (virtual key emitida pelo gateway).
      LITELLM_BASE_URL: http://litellm:4000
    networks:
      - default
      - gateway
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aplica migrations e sobe a API. Cron e workers rodam embutidos no serviço.
    command: sh -c "pnpm db:migrate && node dist/main.js"

networks:
  # Rede do stack do gateway de IA (docker-compose do C:\LLMlite, project
  # "audax-ai-gateway" → rede "audax-gw"). Marcada como externa: suba o gateway
  # primeiro. Se preferir desacoplar, remova esta rede e aponte LITELLM_BASE_URL
  # para http://host.docker.internal:4000 no .env.
  gateway:
    external: true
    name: audax-ai-gateway_audax-gw

volumes:
  postgres-data:
  redis-data:
