# Reverse proxy do portal Audax Notícias (produção / VPS interna).
# Uma porta (80): serve o portal (Next) e roteia /api → backend (Fastify).
server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # API REST (inclui o chat em streaming) → backend
    location /api/ {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat token-a-token: sem buffering e timeout folgado.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Portal Next.js (SSR + assets)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
