# Produção (VPS interna) — stack via Docker, atrás de um Nginx.
# A Evolution API é EXTERNA (já rodando na VPS); este stack NÃO sobe uma nova.
# Uso na VPS:
#   cp .env.example .env   # preencher chaves, WEB_APP_URL, EVOLUTION_BASE_URL (a Evolution existente)
#   docker compose -f docker-compose.prod.yml up -d --build
# Acesso: portal em http://IP-DA-VPS  (Nginx:80). WhatsApp/QR = na sua Evolution já existente.
services:
  postgres:
    image: postgres:16-alpine
    container_name: audax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audax}
      POSTGRES_DB: ${POSTGRES_DB:-audax_noticias}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-audax} -d ${POSTGRES_DB:-audax_noticias}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: audax-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audax-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-audax}:${POSTGRES_PASSWORD:-audax}@postgres:5432/${POSTGRES_DB:-audax_noticias}
      REDIS_URL: redis://redis:6379
      # Evolution é EXTERNA (já rodando na VPS). Defina EVOLUTION_BASE_URL no .env.
      # Default: alcança a Evolution publicada na porta 8080 do HOST da VPS.
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-http://host.docker.internal:8080}
    # Deixa o backend (no compose) alcançar serviços publicados no host da VPS
    # (ex.: a Evolution em host:8080) via host.docker.internal.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "pnpm db:migrate && node dist/main.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vazio = mesma origem (o Nginx roteia /api). Não embute IP no bundle.
        NEXT_PUBLIC_API_URL: ''
    container_name: audax-frontend
    restart: unless-stopped
    environment:
      # SSR (dentro do compose) fala com o backend pela rede interna.
      API_URL_INTERNAL: http://backend:3333
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: audax-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  redis-data:
